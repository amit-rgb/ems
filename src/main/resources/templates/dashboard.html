<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G4 Construction Expense Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>
<main class="container">
    <header class="page-header">
        <h1>G4 Home Project - Expense Tracker</h1>
        <p th:if="${defaultProject != null}" id="projectMeta" th:attr="data-project-id=${defaultProject.id}">
            Plot <strong th:text="${defaultProject.plotNo}"></strong>, <strong th:text="${defaultProject.block}"></strong>
            | Location: <strong th:text="${defaultProject.location}"></strong>
            | Road Width: <strong th:text="${defaultProject.roadWidthFeet} + ' ft'"></strong>
        </p>
    </header>

    <section class="card">
        <h2>Money Spent So Far</h2>
        <div class="summary-grid">
            <div><span>Total Spent:</span> <strong id="totalSpent">-</strong></div>
            <div><span>Remaining Budget:</span> <strong id="remainingBudget">-</strong></div>
        </div>
        <p id="dashboardStatus" class="status"></p>
    </section>

    <section class="card">
        <h2>Log Expense</h2>
        <form id="expenseForm">
                <input id="projectId" name="projectId" type="hidden"
                       th:value="${defaultProject != null ? defaultProject.id : ''}">
                <label>Amount</label>
                <input type="number" step="0.01" min="0.01" id="amount" required>

                <label>Category</label>
                <select id="category" required>
                    <option th:each="item : ${expenseCategories}" th:value="${item}" th:text="${item}"></option>
                </select>

                <label>Stage</label>
                <select id="stage" required>
                    <option th:each="item : ${constructionStages}" th:value="${item}" th:text="${item}"></option>
                </select>

                <label>Payment Mode</label>
                <select id="paymentMode" required>
                    <option th:each="item : ${paymentModes}" th:value="${item}" th:text="${item}"></option>
                </select>

                <label>Status</label>
                <select id="status" required>
                    <option th:each="item : ${expenseStatuses}" th:value="${item}" th:text="${item}"></option>
                </select>

                <label>Vendor Name (optional)</label>
                <select id="vendorName">
                    <option value="">-- Select Registered Vendor --</option>
                </select>
                <a class="muted" th:href="@{/vendors/register}">Register a new vendor</a>

                <label>Description</label>
                <textarea id="description" maxlength="500"></textarea>

                <label>Upload Bill/Receipt (optional)</label>
                <input type="file" id="billFile" accept=".pdf,.jpg,.jpeg,.png,.webp">
                <small id="uploadedBillUrl" class="muted"></small>

                <div class="inline-date">
                    <label for="expenseDate">Expense Date</label>
                    <button type="button" id="todayButton" class="secondary-btn">Use Today</button>
                </div>
                <input type="date" id="expenseDate" required>

                <button type="submit">Submit Expense</button>
        </form>
        <p id="expenseStatus" class="status"></p>
    </section>
</main>

<script th:src="@{/js/dashboard.js}"></script>
</body>
</html>
